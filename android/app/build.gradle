plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.geopulse.geofence_logger"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.geopulse.geofence_logger"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk 26
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            // Normal installable release-mode APK for development/testing.
            // Replace this with a secure production signing config before
            // publishing to Google Play or distributing as a production app.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources.excludes += ['META-INF/NOTICE.md', 'META-INF/LICENSE.md']
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'com.google.android.gms:play-services-base:18.5.0'
    implementation 'androidx.work:work-runtime-ktx:2.10.2'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}

flutter {
    source '../..'
}

